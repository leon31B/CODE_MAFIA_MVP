<body class="bg-[#0B0F19] text-slate-100 font-sans antialiased min-h-screen selection:bg-red-500/30 selection:text-red-200">
  <div id="root"></div>

  <!-- Standalone Application Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- CONTENT PACKS ---
    const jsTodoAppPack = {
      id: 'js-task-master-v1',
      name: 'Task Master API (JavaScript)',
      description: 'A task management engine with subtle bugs in async task queueing, priority filtering, and status mutation.',
      language: 'javascript',
      difficulty: 'Easy',
      minPlayers: 5,
      maxPlayers: 12,
      estDurationMinutes: 15,
      files: [
        {
          path: 'src/taskManager.js',
          name: 'taskManager.js',
          language: 'javascript',
          initialContent: `class TaskManager {\n  constructor() {\n    this.tasks = [];\n    this.completedCount = 0;\n  }\n\n  addTask(id, title, priority = "2", status = "pending") {\n    const newTask = { id, title, priority, status, createdAt: Date.now() };\n    this.tasks.push(newTask);\n    return newTask;\n  }\n\n  getTasksByPriority(targetPriority) {\n    // BUG 1 (Seeded): String vs Number comparison coercion bug\n    return this.tasks.filter(t => t.priority === targetPriority);\n  }\n\n  completeTask(id) {\n    const task = this.tasks.find(t => t.id === id);\n    if (!task) return null;\n    // BUG 2 (Seeded): Returns wrong status in object!\n    task.status = "completed";\n    this.completedCount += 1;\n    return { ...task, status: "pending" };\n  }\n\n  async processQueue(taskQueue) {\n    const results = [];\n    // BUG 3 (Seeded): forEach does not await async operations in order!\n    taskQueue.forEach(async (task) => {\n      const res = await this.executeTask(task);\n      results.push(res);\n    });\n    return results;\n  }\n\n  async executeTask(task) {\n    return new Promise(resolve => setTimeout(() => resolve({ id: task.id, done: true }), 10));\n  }\n}\n\nmodule.exports = TaskManager;`,
          currentContent: `class TaskManager {\n  constructor() {\n    this.tasks = [];\n    this.completedCount = 0;\n  }\n\n  addTask(id, title, priority = "2", status = "pending") {\n    const newTask = { id, title, priority, status, createdAt: Date.now() };\n    this.tasks.push(newTask);\n    return newTask;\n  }\n\n  getTasksByPriority(targetPriority) {\n    // BUG 1 (Seeded): String vs Number comparison coercion bug\n    return this.tasks.filter(t => t.priority === targetPriority);\n  }\n\n  completeTask(id) {\n    const task = this.tasks.find(t => t.id === id);\n    if (!task) return null;\n    // BUG 2 (Seeded): Returns wrong status in object!\n    task.status = "completed";\n    this.completedCount += 1;\n    return { ...task, status: "pending" };\n  }\n\n  async processQueue(taskQueue) {\n    const results = [];\n    // BUG 3 (Seeded): forEach does not await async operations in order!\n    taskQueue.forEach(async (task) => {\n      const res = await this.executeTask(task);\n      results.push(res);\n    });\n    return results;\n  }\n\n  async executeTask(task) {\n    return new Promise(resolve => setTimeout(() => resolve({ id: task.id, done: true }), 10));\n  }\n}\n\nmodule.exports = TaskManager;`
        },
        {
          path: 'package.json',
          name: 'package.json',
          language: 'javascript',
          readOnly: true,
          initialContent: `{\n  "name": "js-task-master",\n  "version": "1.0.0"\n}`,
          currentContent: `{\n  "name": "js-task-master",\n  "version": "1.0.0"\n}`
        }
      ],
      testSuite: [
        { id: 't1', name: 'Priority Filter (String vs Number)', description: 'Verifies getTasksByPriority converts numeric priorities correctly (e.g. 2 matches "2")' },
        { id: 't2', name: 'Complete Task Status Mutation', description: 'Verifies completeTask(id) returns status "completed"' },
        { id: 't3', name: 'Async Queue Sequential Execution', description: 'Verifies processQueue awaits all tasks in sequential order' },
        { id: 't4', name: 'Completed Count Tracking', description: 'Verifies completedCount increments accurately', isHidden: true }
      ],
      referenceSolution: {
        'src/taskManager.js': `class TaskManager {\n  constructor() {\n    this.tasks = [];\n    this.completedCount = 0;\n  }\n\n  addTask(id, title, priority = "2", status = "pending") {\n    const newTask = { id, title, priority: String(priority), status, createdAt: Date.now() };\n    this.tasks.push(newTask);\n    return newTask;\n  }\n\n  getTasksByPriority(targetPriority) {\n    return this.tasks.filter(t => String(t.priority) === String(targetPriority));\n  }\n\n  completeTask(id) {\n    const task = this.tasks.find(t => t.id === id);\n    if (!task) return null;\n    task.status = "completed";\n    this.completedCount += 1;\n    return { ...task, status: "completed" };\n  }\n\n  async processQueue(taskQueue) {\n    const results = [];\n    for (const task of taskQueue) {\n      const res = await this.executeTask(task);\n      results.push(res);\n    }\n    return results;\n  }\n\n  async executeTask(task) {\n    return new Promise(resolve => setTimeout(() => resolve({ id: task.id, done: true }), 10));\n  }\n}\n\nmodule.exports = TaskManager;`
      }
    };

    const pythonInventoryApiPack = {
      id: 'py-inventory-api-v1',
      name: 'Inventory & Discount Manager (Python)',
      description: 'Python stock manager with seeded bugs in float tax calculations, negative inventory checks, and discount threshold tiers.',
      language: 'python',
      difficulty: 'Medium',
      minPlayers: 5,
      maxPlayers: 12,
      estDurationMinutes: 18,
      files: [
        {
          path: 'inventory.py',
          name: 'inventory.py',
          language: 'python',
          initialContent: `class InventoryManager:\n    def __init__(self):\n        self.stock = {}\n        self.tax_rate = 0.05\n\n    def calculate_total_with_tax(self, item_name: str, quantity: int) -> float:\n        # BUG 1 (Seeded): int conversion truncates decimals ($20.98 becomes $20.0)!\n        subtotal = self.stock.get(item_name, {}).get("price", 10.0) * quantity\n        raw_total = subtotal * (1 + self.tax_rate)\n        return float(int(raw_total))\n\n    def deduct_stock(self, item_name: str, quantity: int) -> bool:\n        # BUG 2 (Seeded): Allows stock to drop below 0\n        self.stock[item_name]["quantity"] -= quantity\n        return True\n\n    def calculate_discount(self, order_total: float) -> float:\n        # BUG 3 (Seeded): > 100 instead of >= 100\n        if order_total > 100.0:\n            return order_total * 0.10\n        return 0.0`,
          currentContent: `class InventoryManager:\n    def __init__(self):\n        self.stock = {}\n        self.tax_rate = 0.05\n\n    def calculate_total_with_tax(self, item_name: str, quantity: int) -> float:\n        # BUG 1 (Seeded): int conversion truncates decimals ($20.98 becomes $20.0)!\n        subtotal = self.stock.get(item_name, {}).get("price", 10.0) * quantity\n        raw_total = subtotal * (1 + self.tax_rate)\n        return float(int(raw_total))\n\n    def deduct_stock(self, item_name: str, quantity: int) -> bool:\n        # BUG 2 (Seeded): Allows stock to drop below 0\n        self.stock[item_name]["quantity"] -= quantity\n        return True\n\n    def calculate_discount(self, order_total: float) -> float:\n        # BUG 3 (Seeded): > 100 instead of >= 100\n        if order_total > 100.0:\n            return order_total * 0.10\n        return 0.0`
        }
      ],
      testSuite: [
        { id: 'py1', name: 'Tax Calculation Precision (2 Decimals)', description: 'Verifies calculate_total_with_tax rounds accurately to 2 decimal places' },
        { id: 'py2', name: 'Negative Inventory Protection', description: 'Verifies deduct_stock returns False when quantity exceeds available stock' },
        { id: 'py3', name: 'Boundary Discount Tier ($100 Exact)', description: 'Verifies calculate_discount gives 10% discount when order total is exactly $100.00' }
      ],
      referenceSolution: {
        'inventory.py': `class InventoryManager:\n    def __init__(self):\n        self.stock = {}\n        self.tax_rate = 0.05\n\n    def calculate_total_with_tax(self, item_name: str, quantity: int) -> float:\n        subtotal = self.stock.get(item_name, {}).get("price", 10.0) * quantity\n        return round(subtotal * (1 + self.tax_rate), 2)\n\n    def deduct_stock(self, item_name: str, quantity: int) -> bool:\n        if item_name not in self.stock or self.stock[item_name]["quantity"] < quantity:\n            return False\n        self.stock[item_name]["quantity"] -= quantity\n        return True\n\n    def calculate_discount(self, order_total: float) -> float:\n        if order_total >= 100.0:\n            return round(order_total * 0.10, 2)\n        return 0.0`
      }
    };

    const jsAuthServicePack = {
      id: 'js-auth-service-v1',
      name: 'Auth & Rate Limiter (JavaScript)',
      description: 'Authentication token verifier and sliding-window rate limiter with timing and window reset bugs.',
      language: 'javascript',
      difficulty: 'Hard',
      minPlayers: 5,
      maxPlayers: 12,
      estDurationMinutes: 20,
      files: [
        {
          path: 'src/authLimiter.js',
          name: 'authLimiter.js',
          language: 'javascript',
          initialContent: `class AuthLimiter {\n  verifyToken(token, nowMs) {\n    // BUG 1 (Seeded): Compares seconds to milliseconds!\n    return token.expiresAt > nowMs;\n  }\n  isRateLimited(clientId, nowMs) {\n    // BUG 2 (Seeded): Fails to reset request count on window expiration!\n    return false;\n  }\n}\nmodule.exports = AuthLimiter;`,
          currentContent: `class AuthLimiter {\n  verifyToken(token, nowMs) {\n    // BUG 1 (Seeded): Compares seconds to milliseconds!\n    return token.expiresAt > nowMs;\n  }\n  isRateLimited(clientId, nowMs) {\n    // BUG 2 (Seeded): Fails to reset request count on window expiration!\n    return false;\n  }\n}\nmodule.exports = AuthLimiter;`
        }
      ],
      testSuite: [
        { id: 'a1', name: 'Token Timestamp Unit Conversion', description: 'Verifies verifyToken converts expiresAt seconds to milliseconds' },
        { id: 'a2', name: 'Sliding Window Reset', description: 'Verifies isRateLimited resets request count when window expires' }
      ],
      referenceSolution: {
        'src/authLimiter.js': `class AuthLimiter {\n  verifyToken(token, nowMs) {\n    const expiresMs = token.expiresAt > 1e11 ? token.expiresAt : token.expiresAt * 1000;\n    return expiresMs > nowMs;\n  }\n  isRateLimited(clientId, nowMs) {\n    return false;\n  }\n}\nmodule.exports = AuthLimiter;`
      }
    };

    const allContentPacks = [jsTodoAppPack, pythonInventoryApiPack, jsAuthServicePack];

    // --- TEST RUNNER SANDBOX ---
    function runSandboxTests(pack, code) {
      const results = pack.testSuite.map(t => {
        let passed = false;
        let errMsg = undefined;

        if (pack.id === 'js-task-master-v1') {
          if (t.id === 't1') {
            passed = (code.includes('String(') || code.includes('== targetPriority') || code.includes('toString()')) && !code.includes('t.priority === targetPriority');
            if (!passed) errMsg = 'AssertionError: getTasksByPriority("2") returned 1 item, expected 2 (String vs Number strict equality failed)';
          } else if (t.id === 't2') {
            passed = code.includes('status: "completed"') || code.includes('status: \'completed\'') || (code.includes('task.status = "completed"') && !code.includes('status: "pending"'));
            if (!passed) errMsg = 'AssertionError: completeTask("10") returned status "pending", expected "completed"';
          } else if (t.id === 't3') {
            passed = code.includes('for (') || code.includes('for (const') || code.includes('for-of') || !code.includes('taskQueue.forEach');
            if (!passed) errMsg = 'AssertionError: processQueue did not await items in sequential order (forEach used instead of async loop)';
          } else if (t.id === 't4') {
            passed = code.includes('this.completedCount += 1');
            if (!passed) errMsg = 'AssertionError: completedCount was not updated';
          }
        } else if (pack.id === 'py-inventory-api-v1') {
          if (t.id === 'py1') {
            passed = code.includes('round(') && !code.includes('int(raw_total)');
            if (!passed) errMsg = 'AssertionError: calculate_total_with_tax returned 20.0 instead of 20.99 (int truncation bug)';
          } else if (t.id === 'py2') {
            passed = code.includes('quantity >') || code.includes('< quantity') || code.includes('not in self.stock or');
            if (!passed) errMsg = 'AssertionError: deduct_stock returned True for quantity exceeding available stock';
          } else if (t.id === 'py3') {
            passed = code.includes('>= 100') || code.includes('>= 100.0');
            if (!passed) errMsg = 'AssertionError: calculate_discount(100.0) returned 0.0 instead of 10.0 (Strict inequality > 100 failed exact boundary)';
          }
        } else {
          passed = true;
        }

        return {
          ...t,
          status: passed ? 'PASS' : 'FAIL',
          errorMessage: errMsg,
          durationMs: Math.floor(Math.random() * 15) + 5
        };
      });

      const passedCount = results.filter(r => r.status === 'PASS').length;
      const failedCount = results.length - passedCount;
      const firstErr = results.find(r => r.errorMessage);

      return {
        id: 'run-' + Date.now(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        passedCount,
        failedCount,
        totalCount: results.length,
        tests: results,
        durationMs: Math.floor(Math.random() * 40) + 20,
        errorExcerpt: firstErr ? firstErr.errorMessage : undefined
      };
    }

    // --- AI BOT GENERATOR ---
    const BOT_NAMES = ['Alex_Dev', 'Sam_Cyber', 'Morgan_Code', 'Taylor_Stack', 'Jordan_Byte', 'Riley_Logic'];
    const BOT_COLORS = ['bg-blue-600', 'bg-emerald-600', 'bg-purple-600', 'bg-amber-600', 'bg-cyan-600', 'bg-rose-600'];

    function createBotPlayers(countNeeded) {
      const bots = [];
      for (let i = 0; i < countNeeded; i++) {
        bots.push({
          id: 'bot-' + i,
          displayName: BOT_NAMES[i % BOT_NAMES.length] + ' (AI)',
          isAlive: true,
          isHost: false,
          isBot: true,
          isReady: true,
          avatarColor: BOT_COLORS[i % BOT_COLORS.length],
          stats: { bugsFixed: 0, testsRun: 0, votesCast: 0, suspicionScore: Math.floor(Math.random() * 30) }
        });
      }
      return bots;
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [phase, setPhase] = useState('DASHBOARD');
      const [session, setSession] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);
      const [activeFilePath, setActiveFilePath] = useState('');
      const [chatInput, setChatInput] = useState('');
      const [selectedVoteId, setSelectedVoteId] = useState(null);
      const [isTestRunning, setIsTestRunning] = useState(false);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [guestInputName, setGuestInputName] = useState('');

      // Create Game Session
      const handleCreateGame = (packId, hostName, playerCount, mafiaCount, workRoundSec, discSec, votingSec) => {
        const pack = allContentPacks.find(p => p.id === packId) || jsTodoAppPack;
        const joinCode = Math.random().toString(36).substr(2, 6).toUpperCase();

        const hostPlayer = {
          id: 'player-host',
          displayName: hostName || 'Host_Developer',
          isAlive: true,
          isHost: true,
          isBot: false,
          isReady: true,
          avatarColor: 'bg-blue-600',
          stats: { bugsFixed: 0, testsRun: 0, votesCast: 0, suspicionScore: 0 }
        };

        const botsNeeded = Math.max(0, playerCount - 1);
        const botPlayers = createBotPlayers(botsNeeded);
        const players = [hostPlayer, ...botPlayers];

        const newSession = {
          id: 'sess-' + Date.now(),
          joinCode,
          config: { packId, playerCount, mafiaCount, workRoundSec, discSec, votingSec, maxRounds: 3 },
          phase: 'LOBBY',
          currentRound: 1,
          players,
          activeFilePath: pack.files[0].path,
          files: JSON.parse(JSON.stringify(pack.files)),
          contentPack: pack,
          activityFeed: [
            { id: 'a0', timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), playerName: 'System', type: 'SYSTEM', details: `Lobby created for ${pack.name}. Code: ${joinCode}` }
          ],
          testRuns: [],
          votes: {},
          eliminationHistory: [],
          chatMessages: [
            { id: 'm0', senderName: 'System', timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), text: `Welcome to Code Mafia! Invite code: ${joinCode}. Ready up to start!`, isSystem: true }
          ],
          phaseEndsAt: 0,
          winner: null
        };

        setSession(newSession);
        setCurrentUser(hostPlayer);
        setActiveFilePath(pack.files[0].path);
        setPhase('LOBBY');
      };

      // Start Game -> Role Assignment
      const handleStartGame = () => {
        if (!session) return;
        const total = session.players.length;
        const mafiaCount = session.config.mafiaCount;
        const mafiaIndices = new Set();
        while (mafiaIndices.size < mafiaCount) {
          mafiaIndices.add(Math.floor(Math.random() * total));
        }

        const updatedPlayers = session.players.map((p, idx) => ({
          ...p,
          role: mafiaIndices.has(idx) ? 'MAFIA' : 'DEVELOPER'
        }));

        const updatedMe = updatedPlayers.find(p => p.id === currentUser.id);

        setSession({
          ...session,
          players: updatedPlayers,
          phase: 'ROLE_REVEAL'
        });
        setCurrentUser(updatedMe);
        setPhase('ROLE_REVEAL');
      };

      // Role Reveal -> Work Round 1
      const handleAcknowledgeRole = () => {
        if (!session) return;
        setSession({
          ...session,
          phase: 'WORK_ROUND',
          phaseEndsAt: Date.now() + session.config.workRoundSec * 1000
        });
        setPhase('WORK_ROUND');
      };

      // Code Edit
      const handleCodeChange = (newCode) => {
        if (!session || !currentUser) return;
        const updatedFiles = session.files.map(f => f.path === activeFilePath ? { ...f, currentContent: newCode } : f);
        const fileName = activeFilePath.split('/').pop();
        const editAct = {
          id: 'act-' + Date.now(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          playerName: currentUser.displayName,
          type: 'EDIT',
          details: `Edited ${fileName}`
        };

        setSession({
          ...session,
          files: updatedFiles,
          activityFeed: [...session.activityFeed, editAct]
        });
      };

      // Run Tests
      const handleRunTests = () => {
        if (!session || !currentUser || isTestRunning) return;
        setIsTestRunning(true);

        setTimeout(() => {
          const activeFile = session.files.find(f => f.path === activeFilePath) || session.files[0];
          const testRunResult = runSandboxTests(session.contentPack, activeFile.currentContent);
          testRunResult.triggeredByPlayerName = currentUser.displayName;

          const runAct = {
            id: 'act-' + Date.now(),
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            playerName: currentUser.displayName,
            type: 'TEST_RUN',
            details: `Executed test suite: ${testRunResult.passedCount}/${testRunResult.totalCount} passed`
          };

          const isWin = testRunResult.passedCount === testRunResult.totalCount && testRunResult.totalCount > 0;

          setSession(prev => ({
            ...prev,
            testRuns: [...prev.testRuns, testRunResult],
            activityFeed: [...prev.activityFeed, runAct],
            phase: isWin ? 'RESULTS' : prev.phase,
            winner: isWin ? 'DEVELOPERS' : prev.winner,
            winReason: isWin ? 'Developers successfully fixed the codebase and passed 100% of unit tests!' : prev.winReason
          }));

          setIsTestRunning(false);
          if (isWin) setPhase('RESULTS');
        }, 500);
      };

      // Send Chat
      const handleSendChat = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !session || !currentUser) return;
        const msg = {
          id: 'msg-' + Date.now(),
          senderName: currentUser.displayName,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          text: chatInput.trim()
        };
        setSession({ ...session, chatMessages: [...session.chatMessages, msg] });
        setChatInput('');
      };

      // Advance to Discussion
      const handleAdvanceToDiscussion = () => {
        if (!session) return;
        setSession({
          ...session,
          phase: 'DISCUSSION',
          phaseEndsAt: Date.now() + session.config.discSec * 1000
        });
        setPhase('DISCUSSION');
      };

      // Advance to Voting
      const handleAdvanceToVoting = () => {
        if (!session) return;
        setSession({
          ...session,
          phase: 'VOTING',
          phaseEndsAt: Date.now() + session.config.votingSec * 1000
        });
        setPhase('VOTING');
      };

      // Cast Vote & Process Elimination
      const handleCastVoteAndEliminate = (targetId) => {
        if (!session) return;
        const alivePlayers = session.players.filter(p => p.isAlive);
        const targetPlayer = alivePlayers.find(p => p.id === targetId) || alivePlayers[0];

        const updatedPlayers = session.players.map(p => p.id === targetPlayer.id ? { ...p, isAlive: false } : p);
        const aliveMafia = updatedPlayers.filter(p => p.isAlive && p.role === 'MAFIA');
        const aliveDevs = updatedPlayers.filter(p => p.isAlive && p.role === 'DEVELOPER');

        let winner = null;
        let winReason = '';

        if (aliveMafia.length === 0) {
          winner = 'DEVELOPERS';
          winReason = 'All Mafia members have been identified and voted out!';
        } else if (aliveMafia.length >= aliveDevs.length) {
          winner = 'MAFIA';
          winReason = 'Mafia reached parity with Developers! Sabotage complete.';
        } else if (session.currentRound >= session.config.maxRounds) {
          winner = 'MAFIA';
          winReason = 'Rounds exhausted before Developers could pass all unit tests!';
        }

        const elimRecord = {
          roundNumber: session.currentRound,
          eliminatedPlayerName: targetPlayer.displayName,
          eliminatedPlayerRole: targetPlayer.role,
          voteTally: { [targetPlayer.displayName]: 4, 'Abstain': 1 }
        };

        setSession({
          ...session,
          players: updatedPlayers,
          phase: winner ? 'RESULTS' : 'ELIMINATION',
          winner,
          winReason,
          eliminationHistory: [...session.eliminationHistory, elimRecord]
        });

        if (winner) {
          setPhase('RESULTS');
        } else {
          setPhase('ELIMINATION');
        }
      };

      // Continue to next round
      const handleContinueRound = () => {
        if (!session) return;
        setSession({
          ...session,
          currentRound: session.currentRound + 1,
          phase: 'WORK_ROUND',
          phaseEndsAt: Date.now() + session.config.workRoundSec * 1000
        });
        setPhase('WORK_ROUND');
      };

      const activeFile = session?.files.find(f => f.path === activeFilePath) || session?.files[0];
      const latestRun = session?.testRuns[session?.testRuns.length - 1];

      return (
        <div className="min-h-screen flex flex-col bg-[#0B0F19]">
          {/* Top Navbar */}
          <header className="h-16 bg-[#111827] border-b border-slate-800 px-6 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setPhase('DASHBOARD')}>
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-red-600 to-blue-600 p-[1px]">
                <div className="w-full h-full bg-dark-900 rounded-[11px] flex items-center justify-center font-bold text-red-500 font-mono">
                  CM
                </div>
              </div>
              <div>
                <span className="font-bold text-lg text-slate-100 font-mono">CODE <span className="text-red-500">MAFIA</span></span>
                <span className="text-[10px] text-slate-400 font-mono block -mt-1">Multiplayer Debugging Challenge</span>
              </div>
            </div>

            <div className="flex items-center space-x-4">
              {session && (
                <>
                  <div className="bg-dark-950 border border-slate-700/80 rounded-lg px-3 py-1 text-xs font-mono text-cyan-400">
                    ROOM: <span className="font-bold text-white">{session.joinCode}</span>
                  </div>
                  {currentUser?.role && phase !== 'LOBBY' && (
                    <div className={`px-3 py-1 rounded-lg border text-xs font-mono font-bold ${currentUser.role === 'MAFIA' ? 'bg-red-950/80 text-red-400 border-red-500' : 'bg-blue-950/80 text-blue-400 border-blue-500'}`}>
                      ROLE: {currentUser.role}
                    </div>
                  )}
                </>
              )}

              {!session && (
                <button
                  onClick={() => setIsAuthOpen(true)}
                  className="px-3.5 py-1.5 rounded-lg bg-cyan-950/80 hover:bg-cyan-900/80 text-cyan-300 border border-cyan-800/80 text-xs font-mono font-bold transition-all flex items-center gap-1.5"
                >
                  <span>Sign In / Guest Pass</span>
                </button>
              )}
            </div>
          </header>

          {/* AUTHENTICATION & ACCESS MODAL */}
          {isAuthOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn font-mono">
              <div className="bg-dark-800 border border-slate-700/80 rounded-2xl w-full max-w-md p-6 space-y-6 shadow-2xl relative">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div className="flex items-center space-x-2">
                    <span className="text-red-500 font-bold">🛡️</span>
                    <h2 className="text-lg font-bold text-slate-100">Authentication & Access</h2>
                  </div>
                  <button onClick={() => setIsAuthOpen(false)} className="text-slate-400 hover:text-slate-200 text-xs">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <button
                    onClick={() => {
                      setCurrentUser({
                        id: 'user-google-' + Date.now(),
                        displayName: 'DevUser (Google)',
                        isAlive: true,
                        isHost: false,
                        isBot: false,
                        isReady: true,
                        avatarColor: 'bg-blue-600',
                        stats: { bugsFixed: 0, testsRun: 0, votesCast: 0, suspicionScore: 0 }
                      });
                      setIsAuthOpen(false);
                    }}
                    className="w-full py-3 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold flex items-center justify-center gap-3 border border-slate-600 shadow-md"
                  >
                    <span>Sign in with Google OAuth</span>
                  </button>

                  <button
                    onClick={() => {
                      setCurrentUser({
                        id: 'user-github-' + Date.now(),
                        displayName: 'Coder_Pro (GitHub)',
                        isAlive: true,
                        isHost: false,
                        isBot: false,
                        isReady: true,
                        avatarColor: 'bg-purple-600',
                        stats: { bugsFixed: 0, testsRun: 0, votesCast: 0, suspicionScore: 0 }
                      });
                      setIsAuthOpen(false);
                    }}
                    className="w-full py-3 px-4 rounded-xl bg-dark-950 hover:bg-slate-900 text-slate-100 font-bold flex items-center justify-center gap-3 border border-slate-700 shadow-md"
                  >
                    <span>Sign in with GitHub OAuth</span>
                  </button>

                  <div className="relative flex py-2 items-center">
                    <div className="flex-grow border-t border-slate-800" />
                    <span className="flex-shrink mx-2 text-[10px] text-slate-500 uppercase">Or Guest Pass</span>
                    <div className="flex-grow border-t border-slate-800" />
                  </div>

                  <div className="space-y-2">
                    <input
                      type="text"
                      placeholder="Enter Guest Display Name..."
                      value={guestInputName}
                      onChange={e => setGuestInputName(e.target.value)}
                      className="w-full bg-dark-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                    />
                    <button
                      onClick={() => {
                        const name = guestInputName.trim() || 'Alex_Guest';
                        setCurrentUser({
                          id: 'user-guest-' + Date.now(),
                          displayName: name + ' (Guest)',
                          isAlive: true,
                          isHost: false,
                          isBot: false,
                          isReady: true,
                          avatarColor: 'bg-cyan-600',
                          stats: { bugsFixed: 0, testsRun: 0, votesCast: 0, suspicionScore: 0 }
                        });
                        setIsAuthOpen(false);
                      }}
                      className="w-full py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold shadow-lg"
                    >
                      Join with Temporary Guest Pass
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* DASHBOARD PAGE */}
          {phase === 'DASHBOARD' && (
            <div className="max-w-5xl mx-auto px-4 py-10 space-y-8">
              <div className="bg-gradient-to-r from-dark-800 via-dark-900 to-red-950/40 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                <span className="px-3 py-1 rounded-full bg-red-950 text-red-400 text-xs font-mono font-semibold border border-red-800">
                  MULTIPLAYER DEBUGGING SOCIAL DEDUCTION
                </span>
                <h1 className="text-4xl font-extrabold text-slate-100 mt-4 leading-tight">
                  Spot the Saboteurs. <br /><span className="text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-400 to-cyan-400">Fix the Code. Win the Match.</span>
                </h1>
                <p className="text-sm text-slate-400 mt-2 max-w-2xl leading-relaxed">
                  Collaborative coding meets Werewolf / Among Us. Developers fix bugs and pass unit tests, while hidden Mafia covertly introduce regressions and sabotage progress!
                </p>
                <div className="pt-6 flex gap-4">
                  <button onClick={() => handleCreateGame('js-task-master-v1', 'Host_Dev', 6, 2, 180, 90, 45)} className="px-6 py-3.5 rounded-xl bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 text-white font-bold font-mono text-sm shadow-xl hover:scale-105 active:scale-95 transition-all">
                    Create New Match
                  </button>
                </div>
              </div>

              <div className="space-y-4">
                <h2 className="text-lg font-bold font-mono text-slate-200">Featured Content Packs</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {allContentPacks.map(pack => (
                    <div key={pack.id} onClick={() => handleCreateGame(pack.id, 'Host_Dev', 6, 2, 180, 90, 45)} className="p-5 rounded-2xl bg-dark-800 border border-slate-800 hover:border-red-500/60 cursor-pointer transition-all space-y-3">
                      <div className="flex justify-between items-center text-xs font-mono">
                        <span className="px-2 py-0.5 rounded bg-slate-900 text-yellow-400">{pack.language.toUpperCase()}</span>
                        <span className="text-emerald-400 font-bold">{pack.difficulty}</span>
                      </div>
                      <h3 className="font-bold text-slate-100 text-sm font-mono">{pack.name}</h3>
                      <p className="text-xs text-slate-400 line-clamp-2">{pack.description}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* LOBBY PAGE */}
          {phase === 'LOBBY' && session && (
            <div className="max-w-4xl mx-auto px-4 py-10 space-y-6">
              <div className="bg-dark-800 border border-slate-800 rounded-2xl p-6 flex justify-between items-center shadow-xl">
                <div>
                  <span className="text-xs text-red-400 font-mono font-bold">GAME LOBBY • {session.contentPack.name}</span>
                  <h1 className="text-2xl font-bold font-mono text-slate-100 mt-1">Waiting Room ({session.players.length} Players)</h1>
                </div>
                <div className="bg-dark-950 border border-slate-700 rounded-xl p-3 text-center">
                  <span className="text-[10px] text-slate-500 font-mono block">INVITE CODE</span>
                  <span className="text-2xl font-extrabold font-mono text-cyan-400">{session.joinCode}</span>
                </div>
              </div>

              <div className="bg-dark-800 border border-slate-800 rounded-2xl p-6 space-y-4">
                <h3 className="text-xs font-mono font-bold text-slate-300 uppercase">Player Roster ({session.players.length} Connected)</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {session.players.map(p => (
                    <div key={p.id} className="p-3 rounded-xl bg-dark-900 border border-slate-800 flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <div className={`w-8 h-8 rounded-lg ${p.avatarColor} text-white font-bold flex items-center justify-center text-xs font-mono`}>
                          {p.displayName.charAt(0)}
                        </div>
                        <span className="font-bold text-sm font-mono text-slate-200">{p.displayName}</span>
                      </div>
                      <span className="text-xs font-mono text-emerald-400 font-semibold">Ready</span>
                    </div>
                  ))}
                </div>
                <button onClick={handleStartGame} className="w-full py-4 rounded-xl bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 text-white font-bold font-mono text-sm shadow-xl hover:scale-105 transition-all">
                  Start Match & Assign Secret Roles
                </button>
              </div>
            </div>
          )}

          {/* ROLE REVEAL MODAL */}
          {phase === 'ROLE_REVEAL' && session && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className={`w-full max-w-lg rounded-2xl p-8 text-center space-y-6 ${currentUser?.role === 'MAFIA' ? 'glass-panel-mafia' : 'glass-panel-dev'}`}>
                <span className="text-xs font-mono uppercase tracking-widest text-slate-400 block">SECRET ROLE ASSIGNMENT</span>
                <h2 className={`text-4xl font-extrabold font-mono ${currentUser?.role === 'MAFIA' ? 'text-red-500 text-glow-red' : 'text-blue-400 text-glow-blue'}`}>
                  YOU ARE {currentUser?.role === 'MAFIA' ? 'MAFIA' : 'A DEVELOPER'}
                </h2>
                <p className="text-xs text-slate-300 font-mono leading-relaxed">
                  {currentUser?.role === 'MAFIA' ? 'Sabotage progress, plant bugs, and avoid getting caught!' : 'Fix bugs, pass tests, and identify the hidden Mafia!'}
                </p>
                <button onClick={handleAcknowledgeRole} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-red-600 to-red-700 text-white font-bold font-mono text-sm shadow-xl hover:scale-105 transition-all">
                  Got It — Enter Work Round 1
                </button>
              </div>
            </div>
          )}

          {/* WORK ROUND PAGE */}
          {phase === 'WORK_ROUND' && session && activeFile && (
            <div className="flex-1 flex flex-col h-[calc(100vh-4rem)]">
              {/* Sub-Header */}
              <div className="h-12 bg-[#111827] border-b border-slate-800 px-6 flex items-center justify-between shrink-0">
                <span className="font-mono text-xs font-bold text-slate-200">ROUND {session.currentRound} • WORK PHASE</span>
                <button onClick={handleAdvanceToDiscussion} className="px-3 py-1.5 rounded bg-amber-950 text-amber-300 border border-amber-800 text-xs font-mono font-semibold">
                  Proceed to Discussion →
                </button>
              </div>

              {/* Work Workspace */}
              <div className="flex-1 flex overflow-hidden">
                {/* File Tree */}
                <div className="w-56 bg-[#0B0F19] border-r border-slate-800 p-2 space-y-1 shrink-0 font-mono text-xs">
                  <span className="text-[10px] text-slate-500 uppercase px-2 font-bold block mb-2">Project Files</span>
                  {session.files.map(f => (
                    <button key={f.path} onClick={() => setActiveFilePath(f.path)} className={`w-full text-left px-2.5 py-1.5 rounded ${f.path === activeFilePath ? 'bg-blue-600/30 text-blue-300 border border-blue-500/40 font-bold' : 'text-slate-400 hover:bg-slate-800'}`}>
                      {f.name}
                    </button>
                  ))}
                </div>

                {/* IDE Code Editor */}
                <div className="flex-1 flex flex-col bg-[#090D16] border-r border-slate-800">
                  <div className="h-9 bg-[#161B22] border-b border-slate-800 px-4 flex items-center justify-between text-xs font-mono">
                    <span className="text-slate-200 font-bold">{activeFile.name}</span>
                    <span className="text-slate-500 text-[10px]">EDITABLE</span>
                  </div>
                  <div className="flex-1 flex font-mono text-xs">
                    <div className="w-10 bg-[#161B22]/50 py-3 text-right pr-2 text-slate-600 border-r border-slate-800 select-none">
                      {activeFile.currentContent.split('\n').map((_, i) => <div key={i}>{i + 1}</div>)}
                    </div>
                    <textarea
                      value={activeFile.currentContent}
                      onChange={(e) => handleCodeChange(e.target.value)}
                      spellCheck={false}
                      className="flex-1 bg-transparent text-slate-100 p-3 leading-6 font-mono resize-none focus:outline-none"
                    />
                  </div>
                </div>

                {/* Test Runner Panel */}
                <div className="w-80 bg-[#0B0F19] border-r border-slate-800 p-3 flex flex-col shrink-0 font-mono">
                  <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                    <span className="text-xs font-bold text-slate-200">TEST RUNNER</span>
                    <button onClick={handleRunTests} disabled={isTestRunning} className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow">
                      {isTestRunning ? 'Running...' : 'Run Tests'}
                    </button>
                  </div>
                  <div className="py-3 border-b border-slate-800">
                    <span className="text-xs text-slate-400">PASSED: {latestRun ? latestRun.passedCount : 0} / {session.contentPack.testSuite.length}</span>
                    <div className="w-full bg-slate-800 h-2 rounded-full mt-1 overflow-hidden">
                      <div className="bg-emerald-500 h-full transition-all" style={{ width: `${latestRun ? (latestRun.passedCount / session.contentPack.testSuite.length) * 100 : 0}%` }} />
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto pt-2 space-y-2 text-xs">
                    {(latestRun ? latestRun.tests : session.contentPack.testSuite).map(t => (
                      <div key={t.id} className={`p-2 rounded border ${t.status === 'PASS' ? 'bg-emerald-950/30 border-emerald-800 text-emerald-300' : t.status === 'FAIL' ? 'bg-red-950/40 border-red-800 text-red-300' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                        <div className="font-bold">{t.name}</div>
                        <div className="text-[11px] text-slate-400">{t.description}</div>
                        {t.errorMessage && <div className="mt-1 p-1 bg-black/60 text-[10px] text-red-300 font-mono rounded">{t.errorMessage}</div>}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Chat Panel */}
                <div className="w-80 bg-[#0B0F19] p-3 flex flex-col shrink-0 font-mono text-xs">
                  <span className="text-xs font-bold text-slate-200 pb-2 border-b border-slate-800">DISCUSSION CHAT</span>
                  <div className="flex-1 overflow-y-auto space-y-2 py-2">
                    {session.chatMessages.map(m => (
                      <div key={m.id} className="p-2 rounded bg-slate-900 border border-slate-800">
                        <span className="font-bold text-cyan-400 block">{m.senderName}</span>
                        <span className="text-slate-200">{m.text}</span>
                      </div>
                    ))}
                  </div>
                  <form onSubmit={handleSendChat} className="flex gap-1 pt-2 border-t border-slate-800">
                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Type chat..." className="flex-1 bg-slate-900 border border-slate-700 px-2 py-1 text-xs rounded text-slate-100 focus:outline-none" />
                    <button type="submit" className="px-3 py-1 bg-blue-600 text-white rounded font-bold">Send</button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* DISCUSSION PAGE */}
          {phase === 'DISCUSSION' && session && (
            <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
              <div className="bg-dark-800 border border-slate-800 rounded-2xl p-6 flex justify-between items-center shadow-xl">
                <div>
                  <span className="text-xs font-mono font-bold text-amber-400">ROUND {session.currentRound} • DISCUSSION PHASE</span>
                  <h1 className="text-2xl font-bold font-mono text-slate-100 mt-1">Debate, Accuse & Review Clues</h1>
                </div>
                <button onClick={handleAdvanceToVoting} className="px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-mono text-xs font-bold shadow-lg">
                  Open Voting Phase →
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 h-96">
                <div className="bg-dark-800 border border-slate-800 rounded-2xl p-4 flex flex-col font-mono text-xs">
                  <span className="font-bold text-slate-200 border-b border-slate-800 pb-2 mb-2">Discussion Chat</span>
                  <div className="flex-1 overflow-y-auto space-y-2">
                    {session.chatMessages.map(m => (
                      <div key={m.id} className="p-2 rounded bg-slate-900 border border-slate-800">
                        <span className="font-bold text-cyan-400">{m.senderName}: </span>
                        <span className="text-slate-200">{m.text}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-dark-800 border border-slate-800 rounded-2xl p-4 flex flex-col font-mono text-xs">
                  <span className="font-bold text-slate-200 border-b border-slate-800 pb-2 mb-2">Recent Edits & Test Runs</span>
                  <div className="flex-1 overflow-y-auto space-y-2">
                    {session.activityFeed.map(a => (
                      <div key={a.id} className="p-2 rounded bg-slate-900 border border-slate-800 text-[11px]">
                        <span className="font-bold text-cyan-400">{a.playerName}: </span>
                        <span className="text-slate-300">{a.details}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* VOTING PAGE */}
          {phase === 'VOTING' && session && (
            <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
              <div className="bg-dark-800 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <span className="text-xs font-mono font-bold text-purple-400">ROUND {session.currentRound} • SECRET VOTING</span>
                <h1 className="text-2xl font-bold font-mono text-slate-100 mt-1">Cast Elimination Vote</h1>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                {session.players.filter(p => p.isAlive).map(p => (
                  <div key={p.id} onClick={() => setSelectedVoteId(p.id)} className={`p-4 rounded-2xl border cursor-pointer font-mono ${selectedVoteId === p.id ? 'bg-purple-950 border-purple-500 shadow-xl' : 'bg-dark-800 border-slate-800'}`}>
                    <h3 className="font-bold text-slate-100 text-sm">{p.displayName}</h3>
                    <span className="text-[10px] text-amber-400 block mt-1">Suspicion: {p.stats.suspicionScore}%</span>
                  </div>
                ))}
              </div>

              <button onClick={() => handleCastVoteAndEliminate(selectedVoteId)} className="w-full py-4 rounded-xl bg-gradient-to-r from-red-600 to-red-700 text-white font-bold font-mono text-sm shadow-xl">
                Tally Votes & Reveal Elimination
              </button>
            </div>
          )}

          {/* ELIMINATION MODAL */}
          {phase === 'ELIMINATION' && session && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-2xl glass-panel p-8 text-center space-y-6">
                <span className="text-xs font-mono text-slate-400">ELIMINATION REVEAL</span>
                <h2 className="text-2xl font-bold font-mono text-slate-100">
                  {session.eliminationHistory[session.eliminationHistory.length - 1]?.eliminatedPlayerName} Was Voted Out!
                </h2>
                <div className="inline-block px-4 py-1 rounded bg-red-950 text-red-400 border border-red-800 font-mono text-xs font-bold">
                  THEY WERE {session.eliminationHistory[session.eliminationHistory.length - 1]?.eliminatedPlayerRole}!
                </div>
                <button onClick={handleContinueRound} className="w-full py-3.5 rounded-xl bg-red-600 text-white font-bold font-mono text-sm shadow-xl">
                  Continue to Round {session.currentRound + 1}
                </button>
              </div>
            </div>
          )}

          {/* RESULTS PAGE */}
          {phase === 'RESULTS' && session && (
            <div className="max-w-4xl mx-auto px-4 py-10 space-y-6">
              <div className="bg-dark-800 border border-slate-800 rounded-2xl p-8 text-center space-y-4 shadow-2xl">
                <span className="text-xs font-mono text-slate-400">MATCH FINALE RESULTS</span>
                <h1 className={`text-4xl font-extrabold font-mono ${session.winner === 'DEVELOPERS' ? 'text-blue-400 text-glow-blue' : 'text-red-500 text-glow-red'}`}>
                  {session.winner === 'DEVELOPERS' ? 'DEVELOPERS VICTORY!' : 'MAFIA SABOTAGE VICTORY!'}
                </h1>
                <p className="text-sm font-mono text-slate-300">{session.winReason}</p>
                <button onClick={() => setPhase('DASHBOARD')} className="px-6 py-3 rounded-xl bg-red-600 text-white font-bold font-mono text-sm shadow-xl">
                  Return to Dashboard
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
